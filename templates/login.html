
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AutoValue</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="{{ url_for('login') }}">AutoValue<span>.</span></a>
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in to your account</h1>
        <p class="muted">Access your vehicle valuation dashboard.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="notice">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label>Email address</label>
            <input type="email" name="email" placeholder="you@example.com"
                   autocomplete="email" required>

            <label>Password</label>
            <input type="password" name="password"
                   autocomplete="current-password" required>

                    <!-- Forgot Password link -->
    <p class="forgot-password-link">
        <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
    </p>

            <button class="auth-button" type="submit">Sign In →</button>
        </form>

        <p class="auth-footer">
            New to AutoValue?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>
    </main>
</body>
</html>
