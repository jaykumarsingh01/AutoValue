
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AutoValue</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="{{ url_for('login') }}">AutoValue<span>.</span></a>
        <p class="eyebrow">GET STARTED</p>
        <h1>Create your account</h1>
        <p class="muted">Start predicting used-car prices.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="notice">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <label>Full name</label>
            <input type="text" name="username" maxlength="100"
                   autocomplete="name" required>

            <label>Email address</label>
            <input type="email" name="email" maxlength="254"
                   autocomplete="email" required>

            <label>Password</label>
            <input type="password" name="password" minlength="8"
                   autocomplete="new-password" required>

            <label>Confirm password</label>
            <input type="password" name="confirm_password" minlength="8"
                   autocomplete="new-password" required>

            <button class="auth-button" type="submit">
                Create Account →
            </button>
        </form>

        <p class="auth-footer">
            Already registered?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </main>
</body>
</html>
